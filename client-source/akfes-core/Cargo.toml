[package]
name = "akfes-core"
version = "0.1.0"
edition = "2021"
description = "AKFES Secure Messenger cryptographic core"
license = "MIT"

[dependencies]
# Cryptography
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"

# Encoding / Utility
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }

# Optional: secure storage abstractions (platform specific later)
# keyring = "2"  # for OS credential store

[dev-dependencies]
hex = "0.4"
